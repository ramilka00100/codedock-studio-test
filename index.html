<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CodeDock Studio — Автономная мобильная HTML/CSS/JS IDE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast">
        <div class="toast-inner">
            <span id="toast-icon">✓</span>
            <span id="toast-text">Готово</span>
        </div>
    </div>

    <header>
        <div class="header-top">
            <div class="brand-wrap">
                <div class="brand-logo">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                    </svg>
                </div>
                <div class="brand-info">
                    <div class="brand-title-row">
                        <span class="brand-title">CodeDock Studio</span>
                        <span id="unsaved-dot" class="unsaved-dot hidden" title="Есть несохранённые изменения"></span>
                    </div>
                    <button type="button" onclick="openProjectsModal()" class="project-name-btn">
                        <span id="header-project-name">Мой проект</span>
                    </button>
                </div>
            </div>

            <div class="header-actions">
                <button type="button" id="btn-toggle-mode" onclick="toggleEditorMode()" class="btn-pill" title="Режим редактирования">
                    <span id="mode-toggle-label">Единый файл</span>
                </button>

                <button type="button" onclick="toggleAppTheme()" class="btn-icon" style="color: var(--amber);" title="Тема">
                    <svg id="theme-icon-sun" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" stroke-width="2"/>
                        <path stroke-linecap="round" stroke-width="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg id="theme-icon-moon" class="hidden" width="16" height="16" style="color: var(--indigo);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="editor-toolbar" class="editor-toolbar">
            <div class="toolbar-row no-scrollbar">
                <div class="toolbar-tools">
                    <button type="button" onclick="openCdnSnippetsModal('cdn')" class="tool-btn accent">⚡ CDN / Сниппеты</button>
                    <button type="button" onclick="openTemplatesModal()" class="tool-btn">📂 Шаблоны</button>
                </div>
            </div>
            <div class="toolbar-row no-scrollbar">
                <div class="toolbar-tools">
                    <button type="button" onclick="saveCurrentProjectFast()" class="tool-btn save-btn">💾 Сохранить</button>
                    <button type="button" onclick="formatCurrentCode()" class="tool-btn format-btn">✨ Формат</button>
                    <button type="button" onclick="copyCurrentCode()" class="tool-btn">📋 Копировать</button>
                </div>
                <button type="button" onclick="confirmClearCode()" class="tool-btn danger">🗑 Очистить</button>
            </div>
        </div>
    </header>

    <main>
        <div id="view-editor">
            <div class="editor-body">
                <div id="line-numbers" class="line-numbers-col">1</div>
                <div class="editor-layers-wrap">
                    <pre id="code-pre" aria-hidden="true" class="editor-layer"><code id="code-highlight-content"></code></pre>
                    <textarea id="code-textarea" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Ваш код..." class="editor-layer select-text"></textarea>
                </div>
                <aside class="right-action-col" aria-label="История изменений">
                    <button type="button" id="btn-undo" onclick="undoEditor()" class="right-sym-btn" title="Отменить" disabled>↩</button>
                    <button type="button" id="btn-redo" onclick="redoEditor()" class="right-sym-btn" title="Повторить" disabled>↪</button>
                </aside>
            </div>

            <div class="quick-symbols-bar no-scrollbar">
                <button type="button" onclick="insertQuickSymbol('  ')" class="sym-btn">Tab</button>
                <button type="button" onclick="insertQuickSymbol('<')" class="sym-btn">&lt;</button>
                <button type="button" onclick="insertQuickSymbol('>')" class="sym-btn">&gt;</button>
                <button type="button" onclick="insertQuickSymbol('/')" class="sym-btn">/</button>
                <button type="button" onclick="insertQuickSymbol('{')" class="sym-btn">{</button>
                <button type="button" onclick="insertQuickSymbol('}')" class="sym-btn">}</button>
                <button type="button" onclick="insertQuickSymbol(';')" class="sym-btn">;</button>
            </div>
        </div>

        <div id="view-preview" class="hidden">
            <div class="preview-topbar">
                <div class="vp-controls no-scrollbar">
                    <button type="button" id="vp-btn-auto" onclick="setPreviewViewport('auto')" class="vp-btn active">Авто</button>
                    <button type="button" id="vp-btn-mobile" onclick="setPreviewViewport('mobile')" class="vp-btn">Телефон</button>
                    <button type="button" id="vp-btn-tablet" onclick="setPreviewViewport('tablet')" class="vp-btn">Планшет</button>
                    <button type="button" onclick="runPreview()" class="vp-btn" style="color: var(--emerald-text);">↺ Перезагрузить</button>
                </div>
                <button type="button" id="btn-toggle-console" onclick="toggleConsolePanel()" class="vp-btn console-toggle open">
                    <span>Консоль</span>
                    <span id="console-count-badge" class="console-badge">0</span>
                </button>
            </div>

            <div id="preview-stage">
                <div id="preview-frame-wrapper">
                    <iframe id="preview-iframe" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
                </div>
            </div>

            <div id="preview-console-panel">
                <div class="console-head">
                    <div class="console-title">
                        <span>▸ Console</span>
                    </div>
                    <div class="console-actions">
                        <button type="button" onclick="clearConsoleLogs()" class="console-mini-btn">Очистить</button>
                        <button type="button" onclick="toggleConsolePanel(false)" class="console-mini-btn">✕</button>
                    </div>
                </div>
                <div id="console-logs" class="select-text">
                    <div class="console-empty">Логи выполнения появятся здесь при запуске проекта.</div>
                </div>
            </div>
        </div>
    </main>

    <nav id="bottom-dock-nav" class="bottom-dock"></nav>

    <!-- MODALS -->
    <div id="modal-projects" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Древо проектов и файлов</h3>
                <button type="button" onclick="closeModal('modal-projects')" class="modal-close-btn">✕</button>
            </div>
            <div class="modal-subbar">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" onclick="openCreateProjectModal()" class="btn-primary" style="flex: 1;">+ Новый проект</button>
                    <button type="button" onclick="openCreateFolderModal()" class="btn-secondary">+ Папка</button>
                </div>
            </div>
            <div id="projects-tree-container" class="modal-body-scroll"></div>
            <div class="modal-footer-io">
                <div class="io-grid">
                    <button type="button" onclick="exportCurrentProjectSingleHtml()" class="io-btn primary">Единый .HTML</button>
                    <button type="button" onclick="exportFullBackupJson()" class="io-btn">Бэкап .JSON</button>
                    <label class="io-btn import-box" style="grid-column: span 2;">
                        <span>↑ Импорт проекта/бэкапа</span>
                        <input type="file" accept=".html,.htm,.json" onchange="handleFileImport(event)" class="hidden">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-create-project" class="modal-backdrop center-always z-60 hidden">
        <div class="modal-card sm">
            <h3 style="margin: 0; font-size: 14px; font-weight: 700;">Создать проект</h3>
            <input id="new-project-name" type="text" placeholder="Название проекта..." class="field-input select-text">
            <select id="new-project-folder" class="field-select"></select>
            <div style="display: flex; gap: 8px;">
                <button type="button" onclick="closeModal('modal-create-project')" class="btn-secondary" style="flex:1;">Отмена</button>
                <button type="button" onclick="confirmCreateProject()" class="btn-primary" style="flex:1;">Создать</button>
            </div>
        </div>
    </div>

    <div id="modal-folder" class="modal-backdrop center-always z-60 hidden">
        <div class="modal-card sm">
            <h3 style="margin: 0; font-size: 14px; font-weight: 700;">Новая папка</h3>
            <input id="folder-name-input" type="text" placeholder="Имя папки..." class="field-input select-text">
            <div style="display: flex; gap: 8px;">
                <button type="button" onclick="closeModal('modal-folder')" class="btn-secondary" style="flex:1;">Отмена</button>
                <button type="button" onclick="submitFolderModal()" class="btn-primary" style="flex:1;">Создать</button>
            </div>
        </div>
    </div>

    <div id="modal-cdn-snippets" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <div style="display: flex; gap: 6px; flex: 1; margin-right: 12px;">
                    <button type="button" id="cs-tab-btn-cdn" onclick="switchCsTab('cdn')" class="cs-tab-btn active">CDN-библиотеки</button>
                    <button type="button" id="cs-tab-btn-snippets" onclick="switchCsTab('snippets')" class="cs-tab-btn">Сниппеты кода</button>
                </div>
                <button type="button" onclick="closeModal('modal-cdn-snippets')" class="modal-close-btn">✕</button>
            </div>
            <div class="modal-subbar">
                <input id="cs-search-input" type="text" placeholder="Поиск библиотеки или сниппета..." class="field-input select-text" oninput="filterCsContent()">
                <div id="cs-filter-chips" class="cs-filter-row no-scrollbar"></div>
                <button type="button" id="btn-open-new-snippet" onclick="openCreateSnippetModal()" class="btn-emerald hidden" style="padding: 6px 10px; font-size: 11px;">+ Создать свой сниппет (или из выделенного)</button>
            </div>
            <div id="cs-list-container" class="modal-body-scroll"></div>
        </div>
    </div>

    <div id="modal-create-snippet" class="modal-backdrop center-always z-60 hidden">
        <div class="modal-card sm">
            <h3 style="margin: 0; font-size: 14px; font-weight: 700;">Новый сниппет</h3>
            <input id="snippet-title-input" type="text" placeholder="Название сниппета..." class="field-input select-text">
            <select id="snippet-lang-select" class="field-select">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JS</option>
            </select>
            <textarea id="snippet-code-input" placeholder="Вставьте или напишите код сниппета..." class="field-textarea select-text" spellcheck="false"></textarea>
            <div style="display: flex; gap: 8px;">
                <button type="button" onclick="closeModal('modal-create-snippet')" class="btn-secondary" style="flex:1;">Отмена</button>
                <button type="button" onclick="saveCustomSnippet()" class="btn-emerald" style="flex:1;">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="modal-templates" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Шаблоны проектов</h3>
                <button type="button" onclick="closeModal('modal-templates')" class="modal-close-btn">✕</button>
            </div>
            <div id="templates-list" class="modal-body-scroll"></div>
        </div>
    </div>

    <div id="modal-confirm" class="modal-backdrop center-always z-70 hidden">
        <div class="modal-card xs">
            <h3 id="confirm-title" style="margin: 0; font-size: 14px; font-weight: 700;">Подтверждение</h3>
            <p id="confirm-message" style="margin: 0; font-size: 12px; color: var(--text-secondary);"></p>
            <div style="display: flex; gap: 8px;">
                <button type="button" onclick="closeModal('modal-confirm')" class="btn-secondary" style="flex:1;">Отмена</button>
                <button type="button" id="confirm-yes-btn" class="btn-danger" style="flex:1;">Да</button>
            </div>
        </div>
    </div>

 <script src="script.js"></script>
</body>
</html>
